<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera · Observation</title>
<style>
  :root{--bg:#0b0f1a;--ink:#e8e8ec;--dim:#9aa0ac;--line:rgba(255,255,255,.12);--card:rgba(32,34,40,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#10182a 0%,var(--bg) 60%);
       color:var(--ink);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 60px}
  header{padding:26px 28px 10px;border-bottom:1px solid var(--line)}
  .brand{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  h1{margin:6px 0 2px;font-size:22px}
  .sub{color:var(--dim);font-size:13px}
  .summary{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;font-size:12.5px}
  .pill{border:1px solid var(--line);border-radius:18px;padding:3px 11px}
  main{padding:16px 28px;max-width:1040px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
  .sys{color:#8ab4ff}.res-success{color:#9af0b6}.res-blocked{color:#ff9a9a}.res-deferred{color:#f6c454}
  .ev{font-size:11px;color:#7f8694}
  .gov{font-size:11px;color:#9aa0ac}
  .empty{color:#6f6f76;font-style:italic;padding:14px 0}
</style>
</head>
<body>
<header>
  <div class="brand">VERA · OBSERVATION</div>
  <h1>What the operator did — and the proof</h1>
  <div class="sub">Every operator action is a trace-linked event carrying its governance posture and
    evidence references (truth / decision / approval / budget / action / report / cert).</div>
  <div class="summary" id="summary"></div>
</header>
<main id="main"><div class="empty">loading…</div></main>
<script>
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function refs(e){
  var keys=['truth_refs','decision_refs','approval_refs','budget_refs','action_refs','report_refs','cert_refs'];
  var out=[]; keys.forEach(function(k){ (e[k]||[]).forEach(function(r){ out.push(k.replace('_refs','')+':'+esc(r)); }); });
  return out.length? out.join(' · ') : '—';
}
fetch('/observation.json').then(r=>r.json()).then(function(d){
  var s=d.summary||{};
  document.getElementById('summary').innerHTML=
    '<span class="pill">events: '+(s.total||0)+'</span>'
    +'<span class="pill">with evidence: '+(s.with_evidence||0)+'</span>'
    +Object.keys(s.by_system||{}).map(function(k){return '<span class="pill">'+esc(k)+': '+s.by_system[k]+'</span>';}).join('');
  var evs=d.events||[];
  if(!evs.length){document.getElementById('main').innerHTML='<div class="empty">no observation events yet — open an operator surface and they appear here</div>';return;}
  var rows=evs.map(function(e){
    var g=e.governance_state||{};
    return '<tr><td class="ev">'+esc((e.timestamp||'').replace('T',' ').replace('Z',''))+'</td>'
      +'<td class="sys">'+esc(e.system)+'</td><td>'+esc(e.surface)+'</td><td>'+esc(e.action)+'</td>'
      +'<td class="res-'+esc(e.result)+'">'+esc(e.result)+'</td>'
      +'<td class="gov">'+esc(e.authority_level)+(g.kill_switch_active?' · KILL':'')+'</td>'
      +'<td class="ev">'+esc(e.trace_id)+'</td><td class="ev">'+refs(e)+'</td></tr>';
  }).join('');
  document.getElementById('main').innerHTML='<table><thead><tr><th>time</th><th>system</th><th>surface</th>'
    +'<th>action</th><th>result</th><th>authority</th><th>trace</th><th>evidence</th></tr></thead><tbody>'
    +rows+'</tbody></table>';
}).catch(function(e){document.getElementById('main').innerHTML='<div class="empty">could not reach the server ('+esc(e)+')</div>';});
</script>
</body>
</html>
