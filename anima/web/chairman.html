<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera · Chairman</title>
<style>
  :root{--bg:#0b0f1a;--ink:#e8e8ec;--dim:#9aa0ac;--line:rgba(255,255,255,.12);--card:rgba(32,34,40,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#10182a 0%,var(--bg) 60%);
       color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 60px}
  header{padding:26px 28px 12px;border-bottom:1px solid var(--line)}
  .brand{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  h1{margin:6px 0 2px;font-size:22px}
  .lead{font-size:15px;margin:8px 0 0}
  main{padding:18px 28px;max-width:1000px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card.full{grid-column:1 / -1}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .big{font-size:20px;font-weight:600}
  ul{margin:6px 0 0;padding-left:18px}li{margin:3px 0}
  .empty{color:#6f6f76;font-style:italic}
  a{color:#8ab4ff;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="brand">VERA · CHAIRMAN</div>
  <h1>Where should my capital and attention go?</h1>
  <div class="lead" id="lead">loading…</div>
</header>
<main id="main"></main>
<script>
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
fetch('/foundry/portfolio.json').then(r=>r.json()).then(function(p){
  document.getElementById('lead').innerHTML='<span class="big">$'+esc(p.unallocated_budget)+'</span> unallocated of $'+esc(p.total_budget)
    +' · <b>'+esc(p.active_count)+'</b>/'+esc(p.max_active)+' active ventures';
  var byst=p.by_status||{};
  function ids(k){return (byst[k]||[]);}
  document.getElementById('main').innerHTML=
    '<div class="card"><h2>Budget</h2><div>total: $'+esc(p.total_budget)+'</div><div>allocated: $'+esc(p.allocated_budget)+'</div><div>free: $'+esc(p.unallocated_budget)+'</div></div>'
    +'<div class="card"><h2>Active ventures</h2><div class="big">'+esc(p.active_count)+'</div><div class="empty">cap '+esc(p.max_active)+'</div></div>'
    +'<div class="card"><h2>To review / kill / scale</h2>'
      +'<div>review: '+esc(ids("validation").length+ids("experiment").length)+'</div>'
      +'<div>killed: '+esc(ids("killed").length)+'</div>'
      +'<div>scaled: '+esc(ids("scaled").length)+'</div></div>'
    +'<div class="card full"><h2>Ventures</h2>'
      +((p.ventures||[]).length?('<ul>'+p.ventures.map(function(v){return '<li><b>'+esc(v.name)+'</b> — '+esc(v.status)
          +' · $'+esc(v.budget||0)+' budget'+(v.kill_criteria&&v.kill_criteria.length?'':' <span style="color:#f6c454">(no kill criteria — zombie risk)</span>')+'</li>';}).join('')+'</ul>')
        :'<div class="empty">no ventures yet — set the Foundry preflight and submit an idea</div>')
      +'<div style="margin-top:10px;font-size:12px"><a href="/founder">Founder command center →</a> · <a href="/learning">Learning →</a> · <a href="/verification">Verification →</a></div></div>';
}).catch(function(e){document.getElementById('lead').innerHTML='could not reach the server ('+esc(e)+')';});
</script>
</body>
</html>
