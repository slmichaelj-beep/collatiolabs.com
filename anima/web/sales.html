<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera · Sales</title>
<style>
  :root{--bg:#0b0f1a;--ink:#e8e8ec;--dim:#9aa0ac;--line:rgba(255,255,255,.12);--card:rgba(32,34,40,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#10182a 0%,var(--bg) 60%);
       color:var(--ink);font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 60px}
  header{padding:26px 28px 10px;border-bottom:1px solid var(--line)}
  .brand{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  h1{margin:6px 0 2px;font-size:22px}.lead{font-size:15px;margin:8px 0 0}.sub{color:var(--dim);font-size:13px}
  main{padding:18px 28px;max-width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card.full{grid-column:1 / -1}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .big{font-size:18px;font-weight:600}.empty{color:#6f6f76;font-style:italic}
  .ok{color:#9af0b6}.warn{color:#f6c454}
  #govBanner{font-size:11px;color:#9aa0ac;padding:6px 28px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(20,30,50,.4)}
  a{color:#8ab4ff;text-decoration:none}
</style>
</head>
<body>
<div id="govBanner"></div>
<header>
  <div class="brand">VERA · SALES</div>
  <h1>How is selling going — and what's actually revenue?</h1>
  <div class="lead" id="lead">loading…</div>
  <div class="sub">Pipeline → approvals → revenue. Pipeline value is a forecast (assumption); only
    closed-won is revenue. Outreach + closing are governed (approval-gated).</div>
</header>
<main id="main"></main>
<script>
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
fetch('/sales.json').then(r=>r.json()).then(function(d){
  var L=d.loop||{}, rt=L.revenue_truth||{}, pipe=L.pipeline||{};
  document.getElementById('lead').innerHTML='<span class="big">'+esc(d.highest_leverage_next_move||'')+'</span>';
  function stages(by){by=by||{};var ks=Object.keys(by);return ks.length? '<ul>'+ks.map(function(k){return '<li>'+esc(k)+': '+by[k].length+'</li>';}).join('')+'</ul>':'<div class="empty">no opportunities yet</div>';}
  document.getElementById('main').innerHTML=
    '<div class="card"><h2>Revenue truth</h2>'
      +'<div>closed revenue: <b class="ok">$'+esc(rt.closed_revenue||0)+'</b></div>'
      +'<div>pipeline forecast (assumption): <b class="warn">$'+esc(rt.pipeline_value_forecast||0)+'</b></div>'
      +'<div style="font-size:11px;color:#9aa0ac;margin-top:4px">'+esc(d.honesty||'')+'</div></div>'
    +'<div class="card"><h2>Pipeline by stage</h2>'+stages(pipe.by_stage)+'</div>'
    +'<div class="card"><h2>Approvals needed</h2><div>'+esc((pipe.approvals_needed||[]).length||0)+' pending</div>'
      +'<div style="font-size:11px;color:#9aa0ac;margin-top:4px">outreach + binding offers require approval</div></div>'
    +'<div class="card"><h2>Offer readiness</h2><div>ready offers: <b>'+esc((L.offer&&L.offer.ready||[]).join(", ")||"none")+'</b></div>'
      +'<div style="font-size:11px;color:#9aa0ac;margin-top:4px">build the offer on /commercial first</div></div>'
    +'<div class="card full"><h2>The loop</h2>'
      +'<div>assets: '+esc((L.asset_inventory&&L.asset_inventory.total)||0)+' · sellable: '+esc((L.asset_inventory&&L.asset_inventory.sellable||[]).join(", ")||"none")
      +' · approved wedge: '+esc((L.wedge&&L.wedge.approved||[]).join(", ")||"none")+'</div>'
      +'<div style="margin-top:8px;font-size:12px"><a href="/commercial">Commercial (inventory→wedge→offer) →</a> · <a href="/chairman">Chairman →</a> · <a href="/observation">Observation →</a></div></div>';
}).catch(function(e){document.getElementById('lead').innerHTML='could not reach the server ('+esc(e)+')';});
fetch('/governance.json').then(r=>r.json()).then(function(d){var g=(d.governance||{});
  document.getElementById('govBanner').innerHTML='Governance: <b>'+(g.authority_level||'L0')+'</b> · External actions: <b>'
    +(g.external_actions_enabled?'enabled':'disabled')+'</b> · Spending: <b>'+(g.spending_enabled?'enabled':'disabled')
    +'</b> · Legal/Financial: <b>human-only</b> · Kill switch: <b>'+(g.kill_switch_active?'ACTIVE':'available')
    +'</b> · Observed • Trace linked · <a href="/observation">Observation →</a>';}).catch(function(){});
</script>
</body>
</html>
