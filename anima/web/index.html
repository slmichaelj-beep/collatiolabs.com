<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>__NAME__</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,'Inter',system-ui,sans-serif;background:#0a0a0a;color:#e4e4e7;
  display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
header{padding:18px 20px 10px;text-align:center;border-bottom:1px solid #161616}
header h1{font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#fff}
header .state{margin-top:5px;font-size:11px;color:#555;letter-spacing:.05em;min-height:14px}
#log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.45;word-wrap:break-word}
.me{align-self:flex-end;background:#1f2937;color:#e8eaed;border-bottom-right-radius:5px}
.her{align-self:flex-start;background:#141414;color:#d4d4d8;border-bottom-left-radius:5px}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #161616;background:#0a0a0a;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
input{flex:1;background:#141414;border:1px solid #222;border-radius:22px;padding:12px 16px;
  color:#fff;font-size:16px;outline:none}
input:focus{border-color:#374151}
button{background:#1f2937;border:none;color:#fff;border-radius:50%;width:44px;height:44px;
  font-size:18px;cursor:pointer;flex:none}
button:active{background:#374151}
button svg{display:block;margin:auto;pointer-events:none}
#mic.on{background:#b91c1c;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.6)}50%{box-shadow:0 0 0 11px rgba(185,28,28,0)}}
</style>
</head>
<body>
<header><h1>__NAME__</h1><div class="state" id="state"></div></header>
<div id="log"></div>
<form id="f">
  <button type="button" id="mic" aria-label="speak">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/>
      <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V24h2v-3.06A9 9 0 0 0 21 12h-2z"/>
    </svg>
  </button>
  <input id="t" placeholder="say something…" autocomplete="off">
  <button type="submit" title="send">↑</button>
</form>
<script>
const log=document.getElementById('log'),input=document.getElementById('t'),
      stateEl=document.getElementById('state'),mic=document.getElementById('mic');

function add(text,who){const d=document.createElement('div');d.className='msg '+who;
  d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}

// one reused audio element, "blessed" on a tap so iOS lets us play it later
const player=new Audio();
let primed=false;
const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
function prime(){
  if(primed)return; primed=true;
  try{ player.src=SILENT; player.play().catch(()=>{}); }catch(e){}
}
function speak(audioUrl){           // play the Mac's natural (Kokoro) voice only
  if(!audioUrl)return;
  player.src=audioUrl; player.play().catch(()=>{});
}

async function send(text){
  add(text,'me');input.value='';
  try{
    const r=await fetch('/talk',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})});
    const d=await r.json();
    add(d.reply,'her');
    stateEl.textContent=d.feeling+'  ·  '+d.register;
    speak(d.audio_url);
  }catch(e){add('(could not reach the server)','her');}
}

document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();prime();const v=input.value.trim();if(v)send(v);});

// Press-to-dictate. The phone mic needs a secure (https) context — over the
// plain-http LAN address iOS blocks it, so this lights up on the Tailscale link.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false;
if(SR && window.isSecureContext){
  rec=new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=false;
  rec.onstart=()=>{listening=true;mic.classList.add('on');};
  rec.onend  =()=>{listening=false;mic.classList.remove('on');};
  rec.onerror=()=>{listening=false;mic.classList.remove('on');};
  rec.onresult=e=>{
    let txt=''; for(const r of e.results) txt+=r[0].transcript;
    input.value=txt;                                   // show the words as you speak
    if(e.results[e.results.length-1].isFinal){
      const said=input.value.trim(); input.value='';
      if(said) send(said);                             // drop it into the chat + send
    }
  };
}
mic.onclick=()=>{
  prime();
  if(!rec){
    add("To talk out loud you'll need my secure address — open the Tailscale https link. "
        +"For now, tap the text box and use your keyboard's own mic to dictate.","her");
    return;
  }
  if(listening){ rec.stop(); } else { input.value=''; rec.start(); }
};
</script>
</body>
</html>
