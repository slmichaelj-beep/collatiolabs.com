<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera · Pipeline</title>
<style>
  :root{--bg:#0b0f1a;--ink:#e8e8ec;--dim:#9aa0ac;--line:rgba(255,255,255,.12);--card:rgba(32,34,40,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#10182a 0%,var(--bg) 60%);color:var(--ink);font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 60px}
  header{padding:26px 28px 10px;border-bottom:1px solid var(--line)}.brand{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  h1{margin:6px 0 2px;font-size:22px}.sub{color:var(--dim);font-size:13px;max-width:820px}main{padding:18px 28px;max-width:1060px}
  .funnel{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
  .fstep{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .fstep .n{font-size:22px;font-weight:600}.fstep .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.kpi .n{font-size:20px;font-weight:600}.kpi .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .step{margin:16px 0}.step h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:5px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px}
  .s-drafted{color:#9aa0ac}.s-submitted{color:#8ab4ff}.s-replied,.s-interview{color:#c9a6ff}.s-awarded,.s-delivered{color:#f6c454}.s-paid{color:#9af0b6}.s-declined,.s-withdrawn{color:#ff9a9a}
  .bid{color:#9af0b6}.skip{color:#ff9a9a}
  .honest{font-size:12px;color:#f6c454;margin-top:8px}
  #live{font-size:11px;color:#9af0b6}
  #govBanner{font-size:11px;color:#9aa0ac;padding:6px 28px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(20,30,50,.4)}
  a{color:#8ab4ff;text-decoration:none}.empty{color:#6f6f76;font-style:italic}
</style>
</head>
<body>
<div id="govBanner"></div>
<header><div class="brand">VERA · PIPELINE</div>
  <h1>Upwork bid pipeline — live</h1>
  <div class="sub">Real-time funnel: jobs scanned, triaged (bid/skip), staged, submitted, replied,
    awarded, paid. <span id="live">● live</span> · auto-refreshing. Honest accounting: a submitted bid
    is activity, an awarded contract is pipeline, only a PAID contract is collected cash.</div></header>
<main id="main"><div class="empty">loading…</div></main>
<script>
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(d){
  var fn=d.funnel||{}, m=d.money||{}, c=d.connects||{};
  var h='<div class="funnel">'
   +[['Scanned',fn.scanned],['Bid-worthy',fn.bid_verdicts],['Skipped',fn.skipped],['Staged',fn.staged],['Submitted',fn.submitted],['Awarded',(d.by_stage&&(d.by_stage.awarded||0))||0]]
     .map(function(p){return '<div class="fstep"><div class="n">'+esc(p[1]||0)+'</div><div class="l">'+esc(p[0])+'</div></div>';}).join('')+'</div>';
  h+='<div class="grid3">'
   +'<div class="kpi"><div class="l">Activity (bids out)</div><div class="n">'+esc(m.activity_bids||0)+'</div></div>'
   +'<div class="kpi"><div class="l">Pipeline (awarded, not cash)</div><div class="n">$'+esc(m.pipeline_value_awarded||0)+'</div></div>'
   +'<div class="kpi"><div class="l">Collected cash (paid)</div><div class="n">$'+esc(m.collected_cash_paid||0)+'</div></div>'
   +'</div>';
  h+='<div class="card"><span>Connects</span><span>available <b>'+esc(c.available||0)+'</b> · spent '+esc(c.spent||0)+'</span></div>';
  h+='<div class="step"><h2>Active bids</h2>'
   +((d.active_bids||[]).length? d.active_bids.map(function(b){return '<div class="card"><span>'+esc(b.title)+'</span><span><span class="pill s-'+esc(b.status)+'">'+esc(b.status)+'</span> $'+esc(b.amount)+' · '+esc(b.connects)+'c</span></div>';}).join('')
     :'<div class="empty">no active bids yet</div>')+'</div>';
  h+='<div class="step"><h2>Recent triage</h2>'
   +((d.recent_triage||[]).length? d.recent_triage.map(function(t){return '<div class="card"><span><span class="'+(t.verdict==='bid'?'bid':'skip')+'">'+esc(t.verdict.toUpperCase())+'</span> '+esc(t.title)+'</span><span style="opacity:.7;font-size:11px">'+esc(t.reason)+(t.fresh?' · fresh':'')+(t.verified?' · verified':'')+'</span></div>';}).join('')
     :'<div class="empty">no jobs triaged yet</div>')+'</div>';
  h+='<div class="step"><h2>Next move</h2><div class="card"><span>'+esc(d.next_move||'')+'</span></div><div class="honest">'+esc(d.honesty||'')+'</div></div>';
  h+='<div style="margin-top:12px;font-size:12px"><a href="/revenue/cash">Cash milestone →</a> · <a href="/marketplaces/fiverr">Fiverr →</a> · <a href="/observation">Observation →</a></div>';
  document.getElementById('main').innerHTML=h;
}
function tick(){fetch('/pipeline.json').then(r=>r.json()).then(render).catch(function(e){document.getElementById('live').textContent='○ reconnecting';});}
tick(); setInterval(tick, 5000);
fetch('/governance.json').then(r=>r.json()).then(function(d){var g=(d.governance||{});
  document.getElementById('govBanner').innerHTML='Governance: <b>'+(g.authority_level||'L0')+'</b> · Bidding/Sending: <b>human-only</b> · Connects: <b>tracked</b> · Revenue: <b>paid-only counts</b> · Legal/Financial: <b>human-only</b> · Kill switch: <b>'+(g.kill_switch_active?'ACTIVE':'available')+'</b> · Observed • Trace linked · <a href="/observation">Observation →</a>';}).catch(function(){});
</script>
</body>
</html>
